<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Systems Playground</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><path d='M4 26 L12 14 L18 20 L28 6' fill='none' stroke='%232a78d6' stroke-width='4' stroke-linecap='round' stroke-linejoin='round'/></svg>" />
  </head>
  <body>
    <header class="topbar">
      <h1>Systems Playground</h1>
    </header>

    <main class="layout">
      <section class="panel editor-panel" aria-label="Model">
        <div class="panel-head">
          <label for="model" class="panel-title">Model</label>
          <select id="example" aria-label="Load an example">
            <option value="">Load example…</option>
          </select>
        </div>
        <textarea id="model" spellcheck="false" autocapitalize="off" autocomplete="off"></textarea>
        <div id="status" class="status" role="status" aria-live="polite"></div>
        <div class="rounds-row">
          <label for="rounds">Rounds</label>
          <input id="rounds" type="number" min="0" max="10000" step="1" value="100" />
        </div>
      </section>

      <section class="panel output-panel" aria-label="Results">
        <div class="panel-head">
          <div class="tabs" role="tablist">
            <button role="tab" id="tab-chart" aria-selected="true" aria-controls="view-chart">Chart</button>
            <button role="tab" id="tab-table" aria-selected="false" aria-controls="view-table">Table</button>
          </div>
        </div>

        <fieldset class="metrics">
          <legend>
            Stocks
            <span class="metric-actions">
              <button type="button" id="select-all">All</button>
              <button type="button" id="select-none">None</button>
            </span>
          </legend>
          <div id="checkboxes" class="checkboxes"></div>
        </fieldset>

        <div id="view-chart" class="view" role="tabpanel" aria-labelledby="tab-chart">
          <div class="chart-wrap"><canvas id="chart"></canvas></div>
        </div>
        <div id="view-table" class="view" role="tabpanel" aria-labelledby="tab-table" hidden>
          <div class="table-wrap"><table id="table"></table></div>
        </div>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
